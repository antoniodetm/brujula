<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar AR Forzado</title>
    <style>
        :root { --blue: #0a84ff; --green: #32d74b; --red: #ff453a; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: -apple-system, sans-serif; overflow: hidden; color: white; }
        #videoBG { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.6; }
        .overlay { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; background: rgba(0,0,0,0.3); }
        .header { padding: 45px 20px 15px; background: rgba(28,28,30,0.9); border-bottom: 2px solid var(--blue); }
        .search-box { display: flex; gap: 10px; }
        input { flex: 1; background: #3a3a3c; border: none; border-radius: 12px; padding: 15px; color: white; font-size: 16px; outline: none; }
        .guide-system { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        #target-frame { position: absolute; width: 120px; height: 120px; border: 4px solid var(--red); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.1s linear; }
        .status-bar { padding: 10px; background: rgba(0,0,0,0.9); font-family: monospace; font-size: 11px; display: flex; justify-content: space-around; border-top: 1px solid #333; }
        .btn-start { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 30px; background: var(--green); color: white; border: none; border-radius: 25px; font-size: 1.5rem; font-weight: 800; z-index: 1000; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        #instruction { position: absolute; top: 20px; font-weight: 900; font-size: 1.5rem; text-align: center; width: 100%; text-shadow: 2px 2px 4px #000; }
    </style>
</head>
<body>

    <video id="videoBG" autoplay playsinline></video>

    <div class="overlay">
        <div class="header">
            <div class="search-box">
                <input type="text" id="destInput" placeholder="Escribe destino...">
                <button style="background:var(--blue); color:white; border:none; border-radius:10px; padding:10px 20px;" onclick="buscarDestino()">IR</button>
            </div>
        </div>

        <div class="guide-system" id="radarUI">
            <div id="instruction">PULSA INICIAR</div>
            <div id="target-frame">
                <div id="dist-text" style="font-size: 1.5rem; font-weight: bold;">--</div>
            </div>
        </div>

        <div class="status-bar">
            <span id="stat-gps">GPS: ...</span>
            <span id="stat-ori">ORI: ...</span>
        </div>
    </div>

    <button class="btn-start" id="startBtn">INICIAR SENSORES</button>

    <script>
        let myLat, myLon, tLat, tLon, heading;

        document.getElementById('startBtn').addEventListener('click', async function() {
            const btn = this;
            
            // 1. Activar Cámara
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('videoBG').srcObject = stream;
            } catch (e) { console.log("Cámara error"); }

            // 2. Activar Brújula (Lógica Robusta para iPhone)
            if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', (e) => {
                            if (e.webkitCompassHeading) {
                                heading = e.webkitCompassHeading;
                                document.getElementById('stat-ori').innerText = "ORI: OK";
                                document.getElementById('stat-ori').style.color = "#32d74b";
                                actualizar();
                            }
                        }, true);
                    } else {
                        document.getElementById('stat-ori').innerText = "ORI: DENEGADO";
                    }
                } catch (err) {
                    document.getElementById('stat-ori').innerText = "ORI: ERROR";
                    console.error(err);
                }
            } else {
                // Fallback para Android o no-iOS
                window.addEventListener('deviceorientationabsolute', (e) => {
                    heading = 360 - e.alpha;
                    document.getElementById('stat-ori').innerText = "ORI: OK";
                    actualizar();
                }, true);
            }

            // 3. Activar GPS
            navigator.geolocation.watchPosition(pos => {
                myLat = pos.coords.latitude;
                myLon = pos.coords.longitude;
                document.getElementById('stat-gps').innerText = "GPS: OK";
                document.getElementById('stat-gps').style.color = "#32d74b";
                actualizar();
            }, (err) => {
                document.getElementById('stat-gps').innerText = "GPS: ERROR";
            }, { enableHighAccuracy: true });

            // SIEMPRE quitar el botón tras el intento, funcione o no la brújula
            btn.style.display = 'none';
            document.getElementById('instruction').innerText = "BUSCANDO SEÑAL...";
        });

        async function buscarDestino() {
            const q = document.getElementById('destInput').value;
            if(!q) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
            const data = await res.json();
            if (data[0]) {
                tLat = parseFloat(data[0].lat);
                tLon = parseFloat(data[0].lon);
                document.getElementById('instruction').innerText = "RUMBO FIJADO";
            }
        }

        function actualizar() {
            if (!myLat || !tLat || heading === undefined) return;

            const R = 6371e3;
            const dLat = (tLat-myLat) * Math.PI/180;
            const dLon = (tLon-myLon) * Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(myLat*Math.PI/180)*Math.cos(tLat*Math.PI/180)*Math.sin(dLon/2)**2;
            const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            document.getElementById('dist-text').innerText = d > 1000 ? (d/1000).toFixed(1) + "km" : d.toFixed(0) + "m";

            // Cálculo del rumbo
            const y = Math.sin(dLon) * Math.cos(tLat*Math.PI/180);
            const x = Math.cos(myLat*Math.PI/180)*Math.sin(tLat*Math.PI/180) - Math.sin(myLat*Math.PI/180)*Math.cos(tLat*Math.PI/180)*Math.cos(dLon);
            const bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

            let diff = (bearing - heading + 360) % 360;
            if (diff > 180) diff -= 360;

            // Mapeo a pantalla (X píxeles por grado)
            const moveX = diff * 10; 
            document.getElementById('target-frame').style.transform = `translateX(${moveX}px)`;

            if (Math.abs(diff) < 15) {
                document.getElementById('instruction').innerText = "¡ALINEADO!";
                document.getElementById('target-frame').style.borderColor = "#32d74b";
            } else {
                document.getElementById('target-frame').style.borderColor = "#ff453a";
                document.getElementById('instruction').innerText = diff > 0 ? "GIRA DERECHA >>" : "<< GIRA IZQUIERDA";
            }
        }
    </script>
</body>
</html>
