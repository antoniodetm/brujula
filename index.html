<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Forzado AR</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: -apple-system, sans-serif; overflow: hidden; color: white; }
        #videoBG { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.6; }
        .ui { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; background: rgba(0,0,0,0.3); }

        .header { padding: 45px 20px 15px; background: rgba(28,28,30,0.9); border-bottom: 2px solid #0a84ff; }
        .search-box { display: flex; gap: 10px; }
        input { flex: 1; background: #3a3a3c; border: none; border-radius: 10px; padding: 15px; color: white; font-size: 16px; }
        
        .scanner { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Líneas de escáner */
        .line { position: absolute; width: 2px; height: 50%; background: rgba(10, 132, 255, 0.5); }
        #target-box { 
            position: absolute; width: 80px; height: 80px; border: 4px solid #ff453a; 
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-weight: 900; transition: transform 0.1s ease-out;
        }

        #instruction { font-size: 2rem; font-weight: 900; text-align: center; margin-bottom: 20px; color: #ff453a; }
        #dist { font-size: 3.5rem; font-weight: 900; }

        .aligned #target-box { border-color: #32d74b; box-shadow: 0 0 30px #32d74b; background: rgba(50, 215, 75, 0.2); }
        .aligned #instruction { color: #32d74b; }

        /* Consola de errores real */
        #console { position: fixed; bottom: 0; width: 100%; background: rgba(255,0,0,0.8); font-size: 12px; padding: 5px; display: none; }
        .btn-start { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 30px; background: #0a84ff; border: none; border-radius: 20px; color: white; font-size: 1.5rem; font-weight: bold; z-index: 1000; }
    </style>
</head>
<body>

    <video id="videoBG" autoplay playsinline></video>
    <div id="console"></div>

    <div class="ui">
        <div class="header">
            <div class="search-box">
                <input type="text" id="destIn" placeholder="Ej: Torre Eiffel">
                <button onclick="buscar()" style="background:#0a84ff; color:white; border:none; padding:15px; border-radius:10px; font-weight:bold;">IR</button>
            </div>
            <p id="label" style="font-size:12px; margin-top:10px;">ESTADO: ESPERANDO ACTIVACIÓN</p>
        </div>

        <div class="scanner" id="radar">
            <div id="instruction">INICIA EL RADAR</div>
            <div class="line" style="left: 20%;"></div>
            <div class="line" style="right: 20%;"></div>
            <div id="target-box">OBJ</div>
            <div id="dist" style="position: absolute; bottom: 50px;">--</div>
        </div>
    </div>

    <button class="btn-start" id="btn" onclick="activarTodo()">EMPEZAR AHORA</button>

    <script>
        let myLat, myLon, tLat, tLon, heading;
        const cons = document.getElementById('console');

        function error(msg) {
            cons.style.display = 'block';
            cons.innerText = "ALERTA: " + msg;
        }

        async function activarTodo() {
            // Cámara
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('videoBG').srcObject = s;
            } catch(e) { error("Cámara bloqueada"); }

            // Ubicación Forzada
            navigator.geolocation.getCurrentPosition(p => {
                myLat = p.coords.latitude;
                myLon = p.coords.longitude;
                document.getElementById('label').innerText = "GPS CONECTADO";
            }, e => error("GPS FALLÓ: " + e.message), { enableHighAccuracy: true });

            navigator.geolocation.watchPosition(p => {
                myLat = p.coords.latitude;
                myLon = p.coords.longitude;
                loop();
            }, null, { enableHighAccuracy: true });

            // Brújula Forzada iOS
            if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
                const res = await DeviceOrientationEvent.requestPermission();
                if(res === 'granted') {
                    window.addEventListener('deviceorientation', e => {
                        heading = e.webkitCompassHeading;
                        loop();
                    }, true);
                } else { error("Brújula denegada"); }
            }

            document.getElementById('btn').style.display = 'none';
            document.getElementById('instruction').innerText = "BUSCANDO DESTINO...";
        }

        async function buscar() {
            const q = document.getElementById('destIn').value;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`);
            const d = await res.json();
            if(d[0]) {
                tLat = parseFloat(d[0].lat);
                tLon = parseFloat(d[0].lon);
                document.getElementById('label').innerText = "DESTINO FIJADO";
            } else { alert("Lugar no encontrado"); }
        }

        function loop() {
            if(!myLat || !tLat || heading === undefined) return;

            // Distancia
            const R = 6371e3;
            const dLat = (tLat-myLat)*Math.PI/180;
            const dLon = (tLon-myLon)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(myLat*Math.PI/180)*Math.cos(tLat*Math.PI/180)*Math.sin(dLon/2)**2;
            const dist = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            document.getElementById('dist').innerText = dist > 1000 ? (dist/1000).toFixed(1)+"km" : dist.toFixed(0)+"m";

            // Cálculo de ángulo
            const y = Math.sin(dLon) * Math.cos(tLat*Math.PI/180);
            const x = Math.cos(myLat*Math.PI/180)*Math.sin(tLat*Math.PI/180) - Math.sin(myLat*Math.PI/180)*Math.cos(tLat*Math.PI/180)*Math.cos(dLon);
            const bearing = (Math.atan2(y, x)*180/Math.PI + 360) % 360;

            let diff = (bearing - heading + 360) % 360;
            if (diff > 180) diff -= 360;

            // Mover el cuadro en pantalla (X píxeles según grados)
            const posX = diff * 12; 
            document.getElementById('target-box').style.transform = `translateX(${posX}px)`;

            if(Math.abs(diff) < 15) {
                document.getElementById('instruction').innerText = "¡EN EL BLANCO!";
                document.getElementById('radar').classList.add('aligned');
            } else {
                document.getElementById('radar').classList.remove('aligned');
                document.getElementById('instruction').innerText = diff > 0 ? "GIRA A LA DERECHA" : "GIRA A LA IZQUIERDA";
            }
        }
    </script>
</body>
</html>
