<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Radar Personalizado</title>
    <style>
        :root { --ios-blue: #007AFF; --ios-bg: #F2F2F7; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--ios-bg);
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .container {
            width: 90%; max-width: 350px; background: white; padding: 20px;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center; margin-top: 20px;
        }
        /* Buscador */
        .search-box { display: flex; gap: 5px; margin-bottom: 15px; }
        input {
            flex: 1; border: 1px solid #C7C7CC; border-radius: 10px;
            padding: 10px; font-size: 16px; /* 16px evita que iOS haga zoom al escribir */
        }
        .btn-search { background: var(--ios-blue); color: white; border: none; border-radius: 10px; padding: 0 15px; }

        /* Brújula */
        .compass-ring {
            width: 180px; height: 180px; border: 8px solid #E5E5EA;
            border-radius: 50%; margin: 15px auto; position: relative;
            display: flex; align-items: center; justify-content: center; background: #fafafa;
        }
        .arrow {
            width: 0; height: 0; border-left: 12px solid transparent;
            border-right: 12px solid transparent; border-bottom: 45px solid #FF3B30; /* Rojo para destacar */
            position: absolute; transform-origin: center 100%; top: 40px; transition: transform 0.1s linear;
        }
        #distancia { font-size: 1.2rem; font-weight: bold; color: var(--ios-blue); margin: 10px 0; }
        .btn-activate {
            background-color: #34C759; color: white; border: none;
            padding: 15px; border-radius: 15px; font-size: 1rem; font-weight: bold; width: 100%;
        }
        #debug { font-size: 0.7rem; color: #8e8e93; margin-top: 15px; text-align: center; width: 90%; }
    </style>
</head>
<body>

    <div class="container">
        <div class="search-box">
            <input type="text" id="destinoInput" placeholder="Ej: Torre Eiffel o Madrid">
            <button class="btn-search" onclick="buscarLugar()">Ir</button>
        </div>
        
        <p id="target-name" style="margin:5px 0; font-size: 0.9rem; color: #636366;">Destino: No fijado</p>
        
        <div class="compass-ring">
            <div id="flecha" class="arrow"></div>
            <div id="grados" style="position: absolute; bottom: 15px; font-weight: bold;">--°</div>
        </div>

        <div id="distancia">Configura el destino</div>
        
        <button class="btn-activate" id="btnMain" onclick="iniciarSensores()">1. ACTIVAR SENSORES</button>
    </div>

    <div id="debug">Estado: Esperando...</div>

    <script>
        let destLat, destLon;
        let miLat, miLon;
        const debug = document.getElementById('debug');

        async function buscarLugar() {
            const query = document.getElementById('destinoInput').value;
            if (!query) return;
            
            debug.innerText = "Buscando coordenadas...";
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const data = await response.json();
                if (data.length > 0) {
                    destLat = parseFloat(data[0].lat);
                    destLon = parseFloat(data[0].lon);
                    document.getElementById('target-name').innerText = "Destino: " + data[0].display_name.split(',')[0];
                    debug.innerText = "Destino actualizado. ¡Muévete!";
                } else {
                    alert("No se encontró el lugar.");
                }
            } catch (e) {
                alert("Error en la búsqueda.");
            }
        }

        function calcularRumbo(lat1, lon1, lat2, lon2) {
            const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function iniciarSensores() {
            // GPS
            navigator.geolocation.watchPosition(pos => {
                miLat = pos.coords.latitude;
                miLon = pos.coords.longitude;
                if(destLat) {
                    const d = calcularDistancia(miLat, miLon, destLat, destLon);
                    document.getElementById('distancia').innerText = d < 1 ? (d*1000).toFixed(0)+" m" : d.toFixed(2)+" km";
                }
            }, err => alert("Permite el GPS en ajustes"), { enableHighAccuracy: true });

            // Brújula iOS
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const status = await DeviceOrientationEvent.requestPermission();
                if (status === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    document.getElementById('btnMain').style.display = 'none';
                }
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            }
        }

        function handleOrientation(event) {
            let heading = event.webkitCompassHeading || (360 - event.alpha);
            document.getElementById('grados').innerText = Math.round(heading) + "°";
            
            if (heading && miLat && miLon && destLat) {
                const rumboDestino = calcularRumbo(miLat, miLon, destLat, destLon);
                const rotacion = rumboDestino - heading;
                document.getElementById('flecha').style.transform = `rotate(${rotacion}deg)`;
            }
        }
    </script>
</body>
</html>
