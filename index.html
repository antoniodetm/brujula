<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Radar AR iPhone 12</title>
    <style>
        :root { --ios-blue: #0a84ff; }
        body {
            font-family: -apple-system, sans-serif;
            margin: 0; padding: 0; background: #000;
            color: white; overflow: hidden; height: 100vh;
        }

        /* Video de fondo (Cámara) */
        #videoBackground {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: -1;
        }

        /* Capa de Interfaz */
        .ui-overlay {
            position: relative; z-index: 10;
            display: flex; flex-direction: column; height: 100vh;
            background: rgba(0,0,0,0.3); /* Sombra suave para ver la cámara */
        }

        .header { padding: 20px; background: rgba(28,28,30,0.8); }
        .search-box { display: flex; gap: 10px; }
        input {
            flex: 1; background: rgba(255,255,255,0.2); border: 1px solid white;
            border-radius: 12px; padding: 12px; font-size: 18px; color: white;
        }

        .radar-zone {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Brújula traslúcida */
        .compass-ring {
            width: 280px; height: 280px; 
            border: 10px solid rgba(255,255,255,0.5);
            border-radius: 50%; position: relative;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }

        .arrow {
            width: 0; height: 0; 
            border-left: 25px solid transparent; border-right: 25px solid transparent;
            border-bottom: 90px solid #ff453a; 
            position: absolute; transform-origin: center 100%; top: 45px;
        }

        #distancia { font-size: 4rem; font-weight: 900; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }

        /* Botón de Activación XL */
        .btn-activate {
            margin: 20px auto; width: 90%; background: #32d74b; color: white;
            border: none; padding: 20px; border-radius: 20px; font-size: 1.3rem; font-weight: bold;
        }

        .aligned .compass-ring { border-color: #32d74b; }
        .aligned .arrow { border-bottom-color: #32d74b; }
    </style>
</head>
<body>

    <video id="videoBackground" autoplay playsinline></video>

    <div class="ui-overlay">
        <div class="header">
            <div class="search-box">
                <input type="text" id="destinoInput" placeholder="Escribe un destino...">
                <button style="background:var(--ios-blue); color:white; border:none; border-radius:10px; padding:0 15px;" onclick="buscarLugar()">IR</button>
            </div>
            <p id="target-info" style="margin:10px 0 0 0; font-size:0.8rem;">Radar AR Desactivado</p>
        </div>

        <div class="radar-zone" id="uiContainer">
            <div id="distancia">--</div>
            <div class="compass-ring">
                <div id="flecha" class="arrow"></div>
                <div id="grados" style="position:absolute; bottom:30px; font-weight:bold;">--°</div>
            </div>
        </div>

        <button class="btn-activate" id="btnMain" onclick="iniciarTodo()">ACTIVAR CÁMARA Y SENSORES</button>
    </div>

    <script>
        let destLat, destLon, miLat, miLon;

        async function buscarLugar() {
            const q = document.getElementById('destinoInput').value;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
            const data = await res.json();
            if (data[0]) {
                destLat = parseFloat(data[0].lat);
                destLon = parseFloat(data[0].lon);
                document.getElementById('target-info').innerText = `OBJETIVO: ${data[0].display_name.split(',')[0]}`;
            }
        }

        async function iniciarTodo() {
            // 1. Activar Cámara
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, // Usa la cámara trasera
                    audio: false 
                });
                document.getElementById('videoBackground').srcObject = stream;
            } catch (err) {
                alert("No se pudo acceder a la cámara. Revisa los permisos.");
            }

            // 2. Activar GPS
            navigator.geolocation.watchPosition(pos => {
                miLat = pos.coords.latitude;
                miLon = pos.coords.longitude;
                if(destLat) {
                    const d = calcularDistancia(miLat, miLon, destLat, destLon);
                    document.getElementById('distancia').innerText = d > 1000 ? (d/1000).toFixed(1)+"km" : d.toFixed(0)+"m";
                }
            }, null, { enableHighAccuracy: true });

            // 3. Activar Brújula (iPhone)
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const status = await DeviceOrientationEvent.requestPermission();
                if(status === 'granted') window.addEventListener('deviceorientation', hOrient, true);
            }
            
            document.getElementById('btnMain').style.display = 'none';
        }

        function calcularRumbo(lat1, lon1, lat2, lon2) {
            const dL = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dL) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dL);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180; const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180; const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function hOrient(e) {
            let heading = e.webkitCompassHeading || (360 - e.alpha);
            document.getElementById('grados').innerText = Math.round(heading) + "°";
            if (heading && miLat && destLat) {
                const rumbo = calcularRumbo(miLat, miLon, destLat, destLon);
                let diff = (rumbo - heading + 360) % 360;
                let displayRot = diff > 180 ? diff - 360 : diff;
                document.getElementById('flecha').style.transform = `rotate(${displayRot}deg)`;
                
                if(Math.abs(displayRot) < 10) {
                    document.getElementById('uiContainer').classList.add('aligned');
                } else {
                    document.getElementById('uiContainer').classList.remove('aligned');
                }
            }
        }
    </script>
</body>
</html>
